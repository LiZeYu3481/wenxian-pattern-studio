<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 禁止缓存：避免改版后浏览器仍显示旧页面（用户反馈"改了却看不到变化"） -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="纹现 · 民族纹样数字创意平台——让中国民族纹样回到现代日常。纹样志 / 设计间 / 关于纹现" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>纹现 · 民族纹样数字创意平台</title>
    <!-- 真 3D 展示依赖：本地 Three.js（r128 UMD）+ 纹现 3D 运行时，离线可用 -->
    <script src="./assets/three.min.js"></script>
    <script src="./assets/wx3d-runtime.js?v=v14"></script>
    <script type="module" crossorigin src="./assets/index-BdAhaWoD.js?v=v14"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dat4QQay.css">

    <!-- 宠物光标：一只 Hello Kitty 风格的黑白小猫趴在箭头上（白色身体 / 黑色描边 / 黄鼻 / 蝴蝶结） -->
    <style id="wx-pet-style">
      html,body,*{cursor:none!important}
      input,textarea{cursor:text!important}
      #wx-pet{position:fixed;left:0;top:0;width:96px;height:96px;pointer-events:none;z-index:15;will-change:transform;transform:translate3d(-200px,-200px,0)}
      #wx-pet .wx-cat{animation:wx-breathe 1.6s ease-in-out infinite}
      #wx-pet .wx-tail{transform-box:fill-box;transform-origin:0% 50%;animation:wx-tail 1.1s ease-in-out infinite alternate}
      @keyframes wx-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      @keyframes wx-tail{0%{transform:rotate(-12deg)}100%{transform:rotate(14deg)}}
      @media (prefers-reduced-motion:reduce){#wx-pet .wx-cat,#wx-pet .wx-tail{animation:none!important}}
      @media (hover:none){html,body,*{cursor:auto!important}input,textarea{cursor:text!important}#wx-pet{display:none!important}}
    </style>
    <script id="wx-pet-script">
    (function(){
      function init(){
        if(document.getElementById('wx-pet'))return;
        var el=document.createElement('div');
        el.id='wx-pet';
        el.innerHTML=`<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 2 L2 18 L6.4 13.6 L9.3 20.4 L12.3 18.9 L9.4 12.2 L16 12.2 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3" stroke-linejoin="round"/>
          <g class="wx-cat" transform="translate(30 16)">
            <g class="wx-tail"><path d="M12 4 Q22 2 20 -6 Q19 -10 15 -8" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>
            <ellipse cx="0" cy="2" rx="14" ry="9.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
            <ellipse cx="-6" cy="9" rx="3.2" ry="2.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
            <ellipse cx="5" cy="9" rx="3.2" ry="2.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
            <path d="M-10 -8 L-12 -18 L-3 -12 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M10 -8 L12 -18 L3 -12 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M-9 -10 L-10.5 -15.5 L-5 -11.5 Z" fill="#1a1a1a"/>
            <path d="M9 -10 L10.5 -15.5 L5 -11.5 Z" fill="#1a1a1a"/>
            <circle cx="0" cy="-6" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
            <ellipse cx="-4" cy="-7" rx="1.4" ry="2" fill="#1a1a1a"/>
            <ellipse cx="4" cy="-7" rx="1.4" ry="2" fill="#1a1a1a"/>
            <path d="M-2 -3 L2 -3 L0 -1 Z" fill="#e8b84b"/>
            <path d="M0 -1 Q-2 2 -4 0 M0 -1 Q2 2 4 0" stroke="#1a1a1a" stroke-width=".9" fill="none" stroke-linecap="round"/>
            <path d="M-6 -3 L-14 -5 M-6 -1 L-14 -1 M6 -3 L14 -5 M6 -1 L14 -1" stroke="#1a1a1a" stroke-width=".9" stroke-linecap="round"/>
            <g transform="translate(-10 -13) rotate(-18)">
              <path d="M0 0 L-6 -4 L-6 4 Z" fill="#1a1a1a"/>
              <path d="M0 0 L6 -4 L6 4 Z" fill="#1a1a1a"/>
              <circle r="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
            </g>
          </g>
        </svg>`;
        document.body.appendChild(el);
        var x=-200,y=-200,tx=-200,ty=-200,raf=null;
        function loop(){
          x+=(tx-x)*.35;y+=(ty-y)*.35;
          el.style.transform='translate3d('+x+'px,'+y+'px,0)';
          if(Math.abs(tx-x)>.5||Math.abs(ty-y)>.5){raf=requestAnimationFrame(loop)}
          else{x=tx;y=ty;el.style.transform='translate3d('+x+'px,'+y+'px,0)';raf=null}
        }
        document.addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY;if(!raf)raf=requestAnimationFrame(loop)},{passive:true});
      }
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
